[websocket]
url = ws://your-websocket-server-url

[database]
host = localhost
user = username
password = password
dbname = database_name

[settings]
timeout = 30

[time]
# 荷兰时间与本地时间的偏移值（单位：小时）
# 正值表示本地时间早于荷兰时间，负值表示本地时间晚于荷兰时间
# 例如：本地时间21:00，荷兰时间15:00，则偏移值为-6
netherlands_offset_hours = -6
# 是否启用API获取时间（true/false），false则使用固定偏移值
enable_api_time_sync = false

